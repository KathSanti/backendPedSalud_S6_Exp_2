services:
  mysql:
    image: mysql:8.0
    container_name: mysql-petsalud
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}   # se toma del .env
      MYSQL_DATABASE: pedsaluds_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql             # los datos sobreviven si apagas el contenedor

volumes:
  mysql_data: